<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Barony - Battlefield</title>
    <meta name="description" content="Fight out a Barony engagement as a 3D field battle: watch, take over a soldier, or walk in as your own avatar.">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/battle.css}">
</head>
<body class="battle-page">
    <canvas id="view" tabindex="0" aria-label="The battlefield, drawn in 3D"></canvas>

    <!-- What the engine loads; Thymeleaf gives each a content-hashed URL. -->
    <div id="battleAssets" hidden
         th:attr="data-engine-js=@{/battle3d/battle-engine.js},data-engine-wasm=@{/battle3d/battle-engine.wasm}"></div>

    <header class="bt-top">
        <a class="bt-back" href="/game">&larr; Map</a>
        <div class="bt-tally" aria-live="polite">
            <div class="bt-side" id="side0">
                <span class="bt-name" id="side0Name">Your army</span>
                <div class="bt-bar"><div class="bt-fill" id="side0Fill"></div><div class="bt-run" id="side0Run"></div></div>
                <span class="bt-count" id="side0Count">0</span>
            </div>
            <div class="bt-clock"><span id="phase">Ready</span><span id="clock">0:00</span></div>
            <div class="bt-side bt-right" id="side1">
                <span class="bt-name" id="side1Name">Enemy army</span>
                <div class="bt-bar"><div class="bt-fill" id="side1Fill"></div><div class="bt-run" id="side1Run"></div></div>
                <span class="bt-count" id="side1Count">0</span>
            </div>
        </div>
    </header>

    <aside class="bt-panel" id="setupPanel">
        <details open id="setupDetails">
            <summary>Battle setup</summary>
            <div class="bt-form">
                <label for="engagement">From your game</label>
                <select id="engagement"><option value="">Loading your armies&hellip;</option></select>
                <p class="bt-note" id="engagementNote"></p>
                <div class="bt-row">
                    <label for="soldiers0">Your soldiers</label>
                    <input type="number" id="soldiers0" min="1" max="5000" value="40">
                </div>
                <div class="bt-row bt-sub">
                    <label for="archers0">of them archers</label>
                    <input type="number" id="archers0" min="0" max="5000" value="0">
                </div>
                <div class="bt-row bt-sub">
                    <label for="cavalry0">of them cavalry</label>
                    <input type="number" id="cavalry0" min="0" max="5000" value="0">
                </div>
                <div class="bt-row">
                    <label for="morale0">Your morale</label>
                    <input type="number" id="morale0" min="0" max="200" value="100">
                </div>
                <div class="bt-row">
                    <label for="soldiers1">Enemy soldiers</label>
                    <input type="number" id="soldiers1" min="1" max="5000" value="35">
                </div>
                <div class="bt-row bt-sub">
                    <label for="archers1">of them archers</label>
                    <input type="number" id="archers1" min="0" max="5000" value="0">
                </div>
                <div class="bt-row bt-sub">
                    <label for="cavalry1">of them cavalry</label>
                    <input type="number" id="cavalry1" min="0" max="5000" value="0">
                </div>
                <div class="bt-row">
                    <label for="terrain">Ground</label>
                    <select id="terrain">
                        <option value="EMPTY">Open field</option>
                        <option value="VILLAGE">Village</option>
                        <option value="CASTLE">Before a castle</option>
                    </select>
                </div>
                <div class="bt-row">
                    <label for="seed">Seed</label>
                    <input type="number" id="seed" min="1" max="999999" value="42">
                </div>
                <button type="button" id="setupApply" class="bt-primary">Form up the armies</button>
            </div>
        </details>
    </aside>

    <div class="bt-hint" id="hint" aria-live="polite"></div>

    <nav class="bt-controls" aria-label="Battle controls">
        <button type="button" id="playBtn" class="bt-primary">Sound the advance</button>
        <button type="button" id="speedBtn" title="Simulation speed">1&times;</button>
        <button type="button" id="avatarBtn">Enter as your avatar</button>
        <button type="button" id="leaveBtn" hidden>Leave the body</button>
        <button type="button" id="viewBtn" hidden title="First or third person (V)">First person</button>
        <button type="button" id="editAvatarBtn">Avatar&hellip;</button>
        <button type="button" id="restartBtn">Restart</button>
        <button type="button" id="autoBtn" hidden title="Resolve this battle by the map's rule instead of fighting it">Let the map decide</button>
    </nav>

    <!-- Touch controls while embodied -->
    <div class="bt-touch" id="touch" hidden>
        <div class="bt-stick" id="stick" aria-label="Move"><div class="bt-knob" id="knob"></div></div>
        <div class="bt-actions">
            <button type="button" id="blockBtn">Shield</button>
            <button type="button" id="attackBtn" class="bt-primary">Strike</button>
        </div>
    </div>

    <section class="bt-result" id="result" hidden aria-live="polite">
        <h2 id="resultTitle"></h2>
        <p id="resultField"></p>
        <p id="resultMap" class="bt-note"></p>
        <div class="bt-result-actions">
            <button type="button" id="resultAgain" class="bt-primary">Fight it again</button>
            <button type="button" id="resultClose">Look around</button>
            <a href="/game" class="bt-link">Back to the map</a>
        </div>
    </section>

    <dialog id="avatarDialog" class="bt-dialog">
        <form method="dialog" id="avatarForm">
            <h2>Your avatar</h2>
            <p class="bt-note">Saved with your Barony preferences. Your avatar is stronger than a soldier and fights where you send it.</p>
            <label for="avName">Name</label>
            <input type="text" id="avName" maxlength="20" autocomplete="off">
            <fieldset><legend>Tunic</legend><div class="bt-swatches" id="avTunic"></div></fieldset>
            <fieldset><legend>Trim and shield</legend><div class="bt-swatches" id="avTrim"></div></fieldset>
            <div class="bt-row">
                <label for="avHelmet">Head</label>
                <select id="avHelmet">
                    <option value="crown">Crown</option>
                    <option value="greathelm">Great helm</option>
                    <option value="plume">Plumed helm</option>
                    <option value="kettle">Kettle hat</option>
                    <option value="hood">Hood</option>
                    <option value="none">Bare head</option>
                </select>
            </div>
            <div class="bt-row">
                <label for="avWeapon">Weapon</label>
                <select id="avWeapon">
                    <option value="sword">Sword</option>
                    <option value="spear">Spear</option>
                    <option value="axe">Axe</option>
                    <option value="hammer">War hammer</option>
                </select>
            </div>
            <div class="bt-row">
                <label for="avShield">Shield</label>
                <input type="checkbox" id="avShield">
            </div>
            <p class="bt-note" id="avSaved"></p>
            <div class="bt-result-actions">
                <button type="submit" value="save" class="bt-primary" id="avSave">Save</button>
                <button type="submit" value="cancel">Cancel</button>
            </div>
        </form>
    </dialog>

    <script th:src="@{/battle3d/strata-loader.js}"></script>
    <script th:src="@{/battle3d/strata-kit.js}"></script>
    <script th:src="@{/js/battle-sim.js}"></script>
    <script th:src="@{/js/battle-render.js}"></script>
    <script th:src="@{/js/battle-avatar.js}"></script>
    <script th:src="@{/js/battle-page.js}"></script>
</body>
</html>
