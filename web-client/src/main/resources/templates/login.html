<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barony Game - Login</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        body {
            padding: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h1>🏰 Barony</h1>
        <p class="auth-subtitle">Log in to your account</p>

        <div th:if="${error}" class="error">
            <p th:text="${error}"></p>
        </div>

        <div id="formNotice" class="notice" role="status" style="display: none;"></div>

        <div id="formError" class="error" role="alert" style="display: none;">
            <p id="formErrorText"></p>
        </div>

        <form id="loginForm" onsubmit="return login(event)">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required
                       placeholder="Your username"
                       minlength="3"
                       maxlength="50"
                       autocomplete="username"
                       autofocus>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <div class="password-field">
                    <input type="password" id="password" name="password" required
                           placeholder="Your password"
                           minlength="8"
                           autocomplete="current-password">
                    <button type="button" class="password-toggle"
                            onclick="togglePassword('password', this)"
                            aria-label="Show password">Show</button>
                </div>
                <small class="caps-warning" id="capsWarning" role="alert" style="display: none;">⚠ Caps Lock is on.</small>
            </div>

            <div class="form-group keep-guest" id="keepGuestGroup" style="display: none;">
                <label class="checkbox-label">
                    <input type="checkbox" id="keepGuest">
                    Move my guest game into this account (only if the account has no game yet)
                </label>
            </div>

            <button type="submit">Log In</button>
        </form>

        <div class="guest-divider"><span>or</span></div>
        <button type="button" class="guest-button" id="guestButton" onclick="playAsGuest()">Play as guest</button>
        <p class="guest-hint">No account needed. A guest game is kept in this browser and is deleted after 30 days without play.</p>

        <div class="info">
            <p>Don't have an account? <a th:href="@{/register}">Create one</a>.</p>
            <p>Your game progress is saved to your account.</p>
        </div>
    </div>

    <div th:replace="~{fragments/footer :: site-footer}"></div>
    <script>
        // Warn when Caps Lock is on while typing a password — a top cause of
        // "wrong password" failures the player can't see (the field is masked).
        function wireCapsLock(inputId, warningId) {
            const input = document.getElementById(inputId);
            const warn = document.getElementById(warningId);
            if (!input || !warn) return;
            const update = function (e) {
                const on = e.getModifierState && e.getModifierState('CapsLock');
                warn.style.display = on ? 'block' : 'none';
            };
            input.addEventListener('keyup', update);
            input.addEventListener('keydown', update);
            input.addEventListener('blur', function () { warn.style.display = 'none'; });
        }

        function togglePassword(id, btn) {
            const input = document.getElementById(id);
            const reveal = input.type === 'password';
            input.type = reveal ? 'text' : 'password';
            btn.textContent = reveal ? 'Hide' : 'Show';
            btn.setAttribute('aria-label', reveal ? 'Hide password' : 'Show password');
        }

        function showFormError(message) {
            const box = document.getElementById('formError');
            document.getElementById('formErrorText').textContent = message;
            box.style.display = 'block';
        }

        function clearFormError() {
            document.getElementById('formError').style.display = 'none';
        }

        function login(event) {
            event.preventDefault();
            clearFormError();

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;

            if (!username || !password) {
                showFormError('Please enter your username and password.');
                return false;
            }

            const submitBtn = document.querySelector('#loginForm button[type="submit"]');
            const restoreBtn = setButtonBusy(submitBtn, 'Logging in…');

            fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: username, password: password })
            })
            .then(response => response.json().then(data => ({ ok: response.ok, data: data })))
            .then(result => {
                if (!result.ok) {
                    const msg = (result.data && (result.data.message || result.data.error)) || 'Login failed';
                    throw new Error(msg);
                }
                // The token is set by the server in an HttpOnly cookie (JS never sees it); we keep
                // only the username for display on the game screen.
                localStorage.setItem('username', username);
                localStorage.removeItem('barony_mode');
                return claimGuestGameIfAsked();
            })
            .then(() => {
                window.location.href = '/game';
            })
            .catch(error => {
                console.error('Login error:', error);
                showFormError(error.message || 'Login failed. Please try again.');
                restoreBtn();
            });

            return false;
        }

        // "Keep your progress": move this browser's guest game into the account just logged in to.
        // The server only does this for an account with no game yet; otherwise it keeps both as
        // they are (409) and the guest game stays in this browser.
        function claimGuestGameIfAsked() {
            const box = document.getElementById('keepGuest');
            if (!box || !box.checked || localStorage.getItem('barony_has_guest') !== '1') {
                return Promise.resolve();
            }
            return fetch('/api/guest/claim', { method: 'POST' })
                .then(response => {
                    if (response.ok) {
                        localStorage.removeItem('barony_has_guest');
                    } else if (response.status === 409) {
                        sessionStorage.setItem('gameNotice',
                            'This account already had a game, so it was kept. Your guest game is still in this browser.');
                    }
                })
                .catch(error => console.warn('Guest game was not moved:', error));
        }

        function playAsGuest() {
            clearFormError();
            const button = document.getElementById('guestButton');
            const restore = setButtonBusy(button, 'Starting…');
            fetch('/api/guest', { method: 'POST' })
                .then(response => response.json().then(data => ({ ok: response.ok, data: data })))
                .then(result => {
                    if (!result.ok) {
                        const msg = (result.data && (result.data.message || result.data.error))
                            || 'Could not start a guest game.';
                        throw new Error(msg);
                    }
                    // The guest token is in an HttpOnly cookie; the page only remembers the mode.
                    localStorage.setItem('barony_mode', 'guest');
                    localStorage.setItem('barony_has_guest', '1');
                    window.location.href = '/game';
                })
                .catch(error => {
                    showFormError(error.message || 'Could not start a guest game. Please try again.');
                    restore();
                });
        }

        // Disable a submit button and show a pending label so the player gets
        // immediate feedback and can't double-submit; returns a restore fn.
        function setButtonBusy(button, busyLabel) {
            const originalLabel = button.textContent;
            button.disabled = true;
            button.textContent = busyLabel;
            return function () {
                button.disabled = false;
                button.textContent = originalLabel;
            };
        }

        // Pick up a one-time handoff from register/logout: show why we're here
        // and pre-fill the username so the player doesn't retype it.
        document.addEventListener('DOMContentLoaded', function () {
            wireCapsLock('password', 'capsWarning');
            const notice = sessionStorage.getItem('authNotice');
            if (notice) {
                const box = document.getElementById('formNotice');
                box.textContent = notice;
                box.style.display = 'block';
                sessionStorage.removeItem('authNotice');
            }
            if (localStorage.getItem('barony_has_guest') === '1') {
                document.getElementById('keepGuestGroup').style.display = 'block';
                document.getElementById('guestButton').textContent = 'Continue guest game';
                // Coming straight from creating an account: offer to keep the guest game by default.
                document.getElementById('keepGuest').checked =
                    sessionStorage.getItem('offerGuestClaim') === '1';
                sessionStorage.removeItem('offerGuestClaim');
            }
            const prefill = sessionStorage.getItem('prefillUsername');
            if (prefill) {
                document.getElementById('username').value = prefill;
                document.getElementById('password').focus();
                sessionStorage.removeItem('prefillUsername');
            }
        });
    </script>
</body>
</html>
