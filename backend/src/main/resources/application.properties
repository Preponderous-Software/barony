server.port=8080

# Base URL of the standalone UserAuth service used for authentication.
# In docker-compose this is overridden to http://userauth:9998.
userauth.url=${USERAUTH_URL:http://localhost:9998}

# Mark the auth cookie Secure (HTTPS-only). False for local HTTP dev; set true
# in production (over HTTPS) via AUTH_COOKIE_SECURE.
auth.cookie.secure=${AUTH_COOKIE_SECURE:false}

# How long the browser keeps the refresh cookie. Match UserAuth's REFRESH_TOKEN_EXPIRATION_DAYS:
# UserAuth reports no expiry for this token, and it decides when the token stops working.
auth.refresh.cookie-days=${AUTH_REFRESH_COOKIE_DAYS:30}

# Persistence. Defaults to a file-backed embedded H2 database under ./data so saved
# games survive restarts (mount that directory as a volume in production). Set DB_URL
# (+ DB_USERNAME/DB_PASSWORD) to use Postgres instead.
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/barony}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# The backend's own version, baked in from pom.xml by Maven resource filtering.
barony.version=@project.version@

# Usage reporting (https://danielstephenson.dev/usage-reporting). Once the backend is ready it
# sends a single "startup" event carrying the program name (barony), the version above and the
# tag service=true -- nothing per request, and nothing about players, accounts, saved games or
# the host. The send runs on its own daemon thread and never throws or blocks startup. Turn it
# off with USAGE_REPORTING_ENABLED=false.
usage-reporting.enabled=${USAGE_REPORTING_ENABLED:true}
usage-reporting.endpoint=${USAGE_REPORTING_ENDPOINT:https://trace.danielstephenson.dev}
usage-reporting.key=${USAGE_REPORTING_KEY:DLVkvsCqk5OjQ3lrWu9fv8Q0Ik_3g36X7eFXdc1Dzb0}

# Where new games' maps come from. Unset (the default): a fresh random map each game. Set to a
# realms map file (with its world package beside it, or named by BARONY_MAP_PACKAGE), or to
# "example" for the bundled example island, and every new game is that real map instead. Two
# realms play: the file's default realm and the largest other one, unless BARONY_MAP_PLAYERS names
# two realm keys ("player,opponent"). See docs/REAL_MAPS.md.
barony.map.realms=${BARONY_MAP_REALMS:}
barony.map.package=${BARONY_MAP_PACKAGE:}
barony.map.players=${BARONY_MAP_PLAYERS:}
