name: CI Build and Test

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  backend:
    name: Backend Build and Test
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'maven'
        
    - name: Build backend
      run: |
        cd backend
        mvn clean compile
        
    - name: Run backend tests
      run: |
        cd backend
        mvn test
        
    - name: Package backend
      run: |
        cd backend
        mvn package -DskipTests

  web-client:
    name: Web Client Build and Test
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'maven'

    - name: Build web-client
      run: |
        cd web-client
        mvn clean compile

    - name: Run web-client tests
      run: |
        cd web-client
        mvn test

    - name: Package web-client
      run: |
        cd web-client
        mvn package -DskipTests

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Run game page JS tests
      run: node --test web-client/src/test/js/

  battle3d:
    # The 3D battlefield's engine (web-client/battle3d/main.cpp) is built with Emscripten against
    # Strata's pinned wasm release, and its outputs are committed so the Maven build needs no
    # Emscripten. This rebuilds them and fails if the committed bytes differ.
    name: Battlefield engine (rebuild and compare)
    runs-on: ubuntu-latest
    env:
      EMSDK_VERSION: "6.0.11"   # Strata's; everything linked into one .wasm must agree on it
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install emsdk
      run: |
        git clone --depth 1 --branch "$EMSDK_VERSION" https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
        "$RUNNER_TEMP/emsdk/emsdk" install "$EMSDK_VERSION"
        "$RUNNER_TEMP/emsdk/emsdk" activate "$EMSDK_VERSION"

    - name: Rebuild and compare
      run: |
        source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
        web-client/battle3d/build.sh
        git diff --stat --exit-code -- web-client/src/main/resources/static/battle3d/
